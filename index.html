    <meta property="og:title" content="MASEG Immobilien">
    <meta property="og:description" content="Hier entsteht bald etwas Spannendes!">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F8F5F0; /* Soft beige/off-white background matching the image */
            --text-color: #1A1A1A; /* Almost black */
            --accent-color: #4A4A4A;
            --border-color: rgba(26, 26, 26, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Container to keep content centered and constrained */
        .container {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Area */
        h1.logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4.5rem, 12vw, 8.5rem);
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: clamp(0.95rem, 2.5vw, 1.15rem);
            font-weight: 400;
            color: var(--text-color);
            margin-top: 1.5rem;
            margin-bottom: 5rem;
            letter-spacing: 0.02em;
        }

        /* Coming Soon Text */
        .coming-soon {
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            font-weight: 300;
            margin-bottom: 3.5rem;
            color: var(--accent-color);
            line-height: 1.5;
        }

        /* Contact Links */
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            align-items: center;
        }

        .contact-link {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.05rem;
            font-weight: 400;
            padding: 0.9rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background-color: transparent;
            min-width: 280px;
            justify-content: center;
            box-sizing: border-box;
        }

        .contact-link:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .contact-link:active {
            transform: translateY(-1px);
        }

        .contact-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: fill 0.3s ease;
        }

        /* Media queries for larger screens to place buttons side-by-side */
        @media (min-width: 600px) {
            .contact-links {
                flex-direction: row;
                justify-content: center;
                gap: 1.5rem;
            }
            .contact-link {
                min-width: auto;
            }
        }

        /* Footer */
        .footer {
            margin-top: 6rem;
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 300;
            opacity: 0.7;
            letter-spacing: 0.05em;
        }
    </style>
</head>
